<script>
(function(){
var P=JSON.parse(document.getElementById('payload').textContent),K='sb-key-v1';
function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function hex(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
async function derive(pw){var m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.normalize('NFC')),'PBKDF2',false,['deriveBits']);
return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(P.salt),iterations:P.iter},m,256)}
async function open(raw){var k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},k,b64(P.ct));
var html=new TextDecoder().decode(pt);document.open();document.write(html);document.close()}
// 'Remember' keeps the password in this browser's localStorage only (salt/IV change on every publish)
var saved=null;try{saved=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}
if(saved&&saved.pw){derive(saved.pw).then(open).catch(function(){localStorage.removeItem(K)})}
document.getElementById('f').addEventListener('submit',async function(e){e.preventDefault();
var pw=document.getElementById('pw').value,btn=document.getElementById('go'),err=document.getElementById('err');
btn.disabled=true;btn.textContent='Unlocking…';err.textContent='';
try{var raw=await derive(pw);if(document.getElementById('rem').checked)localStorage.setItem(K,JSON.stringify({pw:pw}));await open(raw)}
catch(x){err.textContent='Wrong password.';btn.disabled=false;btn.textContent='Unlock'}});
})();
</script></body></html>
